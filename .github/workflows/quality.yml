name: quality

# Test gate: `npm run quality` runs tsc + Vitest + build.
# Required-status merge-block is convention only — GitHub Free cannot
# require checks on this private repo.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run quality
